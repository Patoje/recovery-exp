# Entorno original de Nextcloud: Nextcloud + PostgreSQL, Restic y runner a demanda.
# El código de Nextcloud sale de la imagen; config/ y el directorio de datos van en volúmenes propios.
name: ncexp

services:
  postgres:
    image: postgres@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d # 16.16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      NC_DB_USER: ${NC_DB_USER}
      NC_DB_PASSWORD: ${NC_DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - pg-dump:/dump
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  nextcloud:
    image: nextcloud@sha256:d8ad0b77c863611b9fab6e72a82a5d35fbcb218b660f9f20fec9941a50806281 # 34.0.5-apache
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${NC_DB_USER}
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud localhost
    volumes:
      - nc-html:/var/www/html
      - nc-config:/var/www/html/config
      - nc-data:/var/www/html/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/status.php"]
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 10s

  restic:
    profiles: ["tools"]
    image: restic/restic@sha256:93999df80d4ac6cb148e82d2ef1fe6a81996f17ff535e772723538211b31555a # 0.20.0
    hostname: nextcloud-original
    environment:
      RESTIC_REPOSITORY: /repo
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
    volumes:
      - restic-repo:/repo
      - nc-data:/data:ro
      - nc-config:/config:ro
      - pg-dump:/dump:ro

  runner:
    profiles: ["tools"]
    build: ../../tools
    image: recexp-runner:local
    entrypoint: ["/work/tools/entrypoint.sh"]
    env_file: ../.env
    environment:
      HOME: /tmp
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      NC_URL: http://nextcloud
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    working_dir: /work
    volumes:
      - ../..:/work:ro
      - ../../runs:/runs
      - nc-data:/data:ro
      - nc-config:/config:ro

volumes:
  pg-data:
  pg-dump:
  nc-html:
  nc-config:
  nc-data:
  restic-repo:
