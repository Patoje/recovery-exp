# Entorno original: Gitea + PostgreSQL, Restic a demanda, MinIO opcional (perfil "minio").
name: recexp

x-gitea-env: &gitea-env
  USER_UID: "1000"
  USER_GID: "1000"
  GITEA__database__DB_TYPE: postgres
  GITEA__database__HOST: postgres:5432
  GITEA__database__NAME: ${POSTGRES_DB}
  GITEA__database__USER: ${POSTGRES_USER}
  GITEA__database__PASSWD: ${POSTGRES_PASSWORD}
  GITEA__security__INSTALL_LOCK: "true"
  GITEA__server__DOMAIN: gitea
  GITEA__server__ROOT_URL: http://gitea:3000/
  GITEA__server__HTTP_PORT: "3000"
  GITEA__server__LFS_START_SERVER: "true"
  GITEA__server__OFFLINE_MODE: "true"
  GITEA__service__DISABLE_REGISTRATION: "true"

services:
  postgres:
    image: postgres@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d # 16.16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pg-dump:/dump
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  gitea:
    image: gitea/gitea@sha256:aa90e8f00b755b0d665214ab9c14447ea44d3190dbe6b6d0cb46cd9c4f55d309 # 28.4.0
    environment: *gitea-env
    volumes:
      - gitea-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  minio:
    profiles: ["minio"]
    image: bitnamilegacy/minio@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20 # 2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET}
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30

  restic:
    profiles: ["tools"]
    image: restic/restic@sha256:93999df80d4ac6cb148e82d2ef1fe6a81996f17ff535e772723538211b31555a # 0.20.0
    hostname: gitea-original
    environment:
      RESTIC_REPOSITORY: /repo
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
    volumes:
      - restic-repo:/repo
      - gitea-data:/data:ro
      - pg-dump:/dump:ro

  runner:
    profiles: ["tools"]
    build: ../tools
    image: recexp-runner:local
    entrypoint: ["/work/tools/entrypoint.sh"]
    env_file: ../.env
    environment:
      HOME: /tmp
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: lfs.locksverify
      GIT_CONFIG_VALUE_0: "false"
      GITEA_URL: http://gitea:3000
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    working_dir: /work
    volumes:
      - ..:/work:ro
      - ../runs:/runs
      - gitea-data:/data:ro

volumes:
  pg-data:
  pg-dump:
  gitea-data:
  minio-data:
  restic-repo:
